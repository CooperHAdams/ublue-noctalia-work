"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold purple)$os$username$hostname$directory$git_branch$git_status$cmd_duration
[╰─](bold purple)$character"""

add_newline = false

[os]
disabled = false
style = "bold blue"
format = "[$symbol ]($style)"

[os.symbols]
Fedora = ""

[username]
show_always = false
style_user = "bold cyan"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold cyan"
format = "[$hostname]($style) in "

[directory]
style = "bold purple"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold green"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
style = "dimmed white"
format = "took [$duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
