# Launch Noctalia desktop shell and Polkit authentication agent on session start
exec-once = [
  "noctalia-shell",
  "/usr/libexec/xfce-polkit"
]

[input.touchpad]
tap = true
natural_scroll = true

[[bind]]
mods = ["Mod"]
key = "Return"
action = "spawn"
args = ["kitty"]

[[bind]]
mods = ["Mod"]
key = "Space"
action = "spawn"
args = ["noctalia-shell", "ipc", "call", "launcher", "toggle"]
