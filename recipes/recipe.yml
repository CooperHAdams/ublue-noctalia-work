name: ublue-noctalia-work
description: Universal Blue work laptop image with Umbriel, Noctalia Shell, and Noctalia Greeter
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - ldivizio/desktop
    install:
      packages:
        # 1. Compositor, Desktop Shell & Noctalia Greeter
        - umbriel
        - noctalia
        - noctalia-greeter
        - greetd
        - cage

        # 2. Core Wayland Laptop Stack
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - xorg-x11-server-Xwayland
        - polkit-gnome
        - kitty
        - thunar
        - thunar-volman
        - gvfs
        - gvfs-mtp
        - file-roller
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - playerctl
        - power-profiles-daemon
        - pipewire
        - wireplumber
        - pipewire-pulseaudio
        - bluez
        - NetworkManager-wifi
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - google-noto-sans-fonts
        - google-noto-emoji-fonts
        - jetbrains-mono-fonts-all

        # 3. Windows & macOS Interoperability
        # SMB/CIFS shares (browsing & mounting Windows/Mac network folders)
        - samba-client
        - cifs-utils
        - gvfs-smb
        # mDNS / Bonjour (.local hostname & AirPrint discovery)
        - avahi
        - nss-mdns
        # Cross-platform external USB/SSD filesystems (exFAT, NTFS, HFS+)
        - exfatprogs
        - ntfs-3g
        - ntfsprogs
        - hfsplus-tools
        # Remote Desktop (Windows RDP & macOS Screen Sharing / VNC)
        - freerdp
        - remmina
        - remmina-plugins-rdp
        - remmina-plugins-vnc
        # Driverless AirPrint / IPP & Windows shared printing/scanning
        - cups
        - cups-filters
        - system-config-printer
        - sane-backends
        - openssh-clients

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - "sed -i 's/^hosts:.*/hosts:      files myhostname mdns4_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] dns/' /etc/nsswitch.conf"

  - type: systemd
    system:
      enabled:
        - greetd.service
        - avahi-daemon.service
        - cups.service
        - bluetooth.service
        - power-profiles-daemon.service
      disabled:
        - getty@tty1.service

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - org.mozilla.firefox
          - org.libreoffice.LibreOffice
          - com.github.tchx84.Flatseal

  - type: signing
