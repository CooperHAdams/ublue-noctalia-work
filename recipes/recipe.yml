name: ublue-noctalia-work
description: Universal Blue work laptop image with Umbriel, Noctalia Shell, tuigreet, Bluefin QOL, and Starship
base-image: ghcr.io/ublue-os/base-main
image-version: 45

modules:
  - type: dnf
    repos:
      copr:
        - ldivizio/desktop
    remove:
      packages:
        - kmscon
    install:
      packages:
        # 1. Compositor, Shell & Login Greeter
        - umbriel
        - noctalia
        - quickshell
        - greetd
        - tuigreet
        - xfce-polkit

        # 2. Core Wayland Laptop Stack
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - xorg-x11-server-Xwayland
        - kitty
        - thunar
        - thunar-volman
        - gvfs
        - gvfs-mtp
        - file-roller
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - playerctl
        - power-profiles-daemon
        - pipewire
        - wireplumber
        - pipewire-pulseaudio
        - bluez
        - NetworkManager-wifi
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - google-noto-sans-fonts
        - google-noto-emoji-fonts
        - jetbrains-mono-fonts-all

        # 3. Bluefin Quality-of-Life, Containers & Brew Build Dependencies
        - distrobox
        - podman-compose
        - just
        - fastfetch
        - powerline
        - powerline-fonts
        - bash-completion
        - fzf
        - ripgrep
        - fd-find
        - bat
        - btop
        - tmux
        - vim-enhanced
        - gcc
        - make
        - procps-ng
        - curl
        - git

        # 4. Windows & macOS Interoperability
        - samba-client
        - cifs-utils
        - gvfs-smb
        - avahi
        - nss-mdns
        - exfatprogs
        - ntfs-3g
        - ntfsprogs
        - hfsplus-tools
        - freerdp
        - remmina
        - remmina-plugins-rdp
        - remmina-plugins-vnc
        - cups
        - cups-filters
        - system-config-printer
        - sane-backends
        - openssh-clients

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - "sed -i 's/^hosts:.*/hosts:      files myhostname mdns4_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] dns/' /etc/nsswitch.conf"
      - "ln -sf /usr/lib/systemd/system/getty@.service /etc/systemd/system/autovt@.service"
      - |
        cat << 'EOF' >> /etc/bashrc
        if [ -f /usr/share/powerline/bash/powerline.sh ]; then
          powerline-daemon -q
          POWERLINE_BASH_CONTINUATION=1
          POWERLINE_BASH_SELECT=1
          source /usr/share/powerline/bash/powerline.sh
        fi
        EOF

  - type: systemd
    system:
      enabled:
        - greetd.service
        - avahi-daemon.service
        - cups.service
        - bluetooth.service
        - power-profiles-daemon.service
        - bootc-fetch-apply-updates.timer
      disabled:
        - getty@tty1.service

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - org.mozilla.firefox
          - org.libreoffice.LibreOffice
          - com.github.tchx84.Flatseal

  - type: signing
