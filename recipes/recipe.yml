name: ublue-noctalia-work
description: Universal Blue work laptop image with Umbriel, Noctalia Shell, and tuigreet
base-image: ghcr.io/ublue-os/base-main
image-version: 45

modules:
  - type: dnf
    repos:
      copr:
        - ldivizio/desktop
    remove:
      packages:
        - kmscon
    install:
      packages:
        # 1. Compositor, Quickshell Runtime & Login Greeter
        - umbriel
        - quickshell
        - greetd
        - tuigreet
        - xfce-polkit

        # 2. Core Wayland Laptop Stack
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - xorg-x11-server-Xwayland
        - kitty
        - thunar
        - thunar-volman
        - gvfs
        - gvfs-mtp
        - file-roller
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - playerctl
        - power-profiles-daemon
        - pipewire
        - wireplumber
        - pipewire-pulseaudio
        - bluez
        - NetworkManager-wifi
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - google-noto-sans-fonts
        - google-noto-emoji-fonts
        - jetbrains-mono-fonts-all

        # 3. Windows & macOS Interoperability
        - samba-client
        - cifs-utils
        - gvfs-smb
        - avahi
        - nss-mdns
        - exfatprogs
        - ntfs-3g
        - ntfsprogs
        - hfsplus-tools
        - freerdp
        - remmina
        - remmina-plugins-rdp
        - remmina-plugins-vnc
        - cups
        - cups-filters
        - system-config-printer
        - sane-backends
        - openssh-clients

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - "sed -i 's/^hosts:.*/hosts:      files myhostname mdns4_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] dns/' /etc/nsswitch.conf"
      - "ln -sf /usr/lib/systemd/system/getty@.service /etc/systemd/system/autovt@.service"
      - "mkdir -p /etc/xdg/quickshell/noctalia-shell && curl -fsSL https://github.com/noctalia-dev/noctalia-shell/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 -C /etc/xdg/quickshell/noctalia-shell"
      - "printf '#!/bin/sh\\nexec qs -p /etc/xdg/quickshell/noctalia-shell \"$@\"\\n' > /usr/bin/noctalia-shell && chmod +x /usr/bin/noctalia-shell"

  - type: systemd
    system:
      enabled:
        - greetd.service
        - avahi-daemon.service
        - cups.service
        - bluetooth.service
        - power-profiles-daemon.service
      disabled:
        - getty@tty1.service

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - org.mozilla.firefox
          - org.libreoffice.LibreOffice
          - com.github.tchx84.Flatseal

  - type: signing
